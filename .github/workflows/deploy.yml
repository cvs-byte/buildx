name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Application Bundle
        run: npm run build
        env:
          VITE_COGNITO_USER_POOL_ID: us-east-1_4IYy9fOND
          VITE_COGNITO_CLIENT_ID: 25f1pvpper6aiije0ufdod082l
          VITE_COGNITO_DOMAIN: https://us-east-14iyy9fond.auth.us-east-1.amazoncognito.com
          VITE_COGNITO_REDIRECT_URI: https://academygrowth.in/callback
          VITE_COGNITO_LOGOUT_URI: https://academygrowth.in/login
          VITE_API_BASE_URL: https://api.academygrowth.in
          VITE_ATTENDANCE_API_BASE_URL: https://api.academygrowth.in
          VITE_AWS_REGION: us-east-1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
